log_format anywear '$time_iso8601 request_id=$request_id client=$remote_addr method=$request_method uri=$uri status=$status request_time=$request_time upstream_status=$upstream_status upstream_time=$upstream_response_time origin="$http_origin"';

server {
    listen 80;
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/lan-server.crt;
    ssl_certificate_key /etc/nginx/certs/lan-server.key;
    access_log /dev/stdout anywear;
    error_log /dev/stderr warn;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/ {
        proxy_pass http://backend:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location = /lan-ca.crt {
        alias /etc/nginx/certs/lan-ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Cache-Control no-store;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
